name: Validate Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install --upgrade pip && pip install -r requirements.txt

    - name: Build dataset
      run: python library/tools/build_dataset.py

    - name: Build outcome indexes and app bundles
      run: python engine/retrieve.py --build

    - name: Finalise dataset digests (manifest, then bundles)
      run: python library/tools/finalize_dataset.py
    - name: Generate app contract artefacts
      run: python library/tools/gen_types.py

    - name: Regenerate the evaluation report (so prose cannot outlive the build)
      run: python engine/evaluate.py --json library/dataset/evaluation.json
    - name: Run validation gate
      run: python library/tools/validate.py --build library/dataset
    - name: Coverage scoreboard (kb/coverage.json must be fresh)
      run: python3 library/tools/score_coverage.py --check

    - name: MCP server (protocol surface + real stdio session)
      run: |
        python3 server/mcp_geomancy.py --self-test
        python3 server/mcp_geomancy.py --transport-test

    - name: Licence scope (three layers, no orphaned or double-claimed path)
      run: python3 library/tools/check_licence_scope.py

    - name: Grounding (citations, licence of quotes, auditor attacks)
      run: python library/tools/check_grounding.py
    - name: Extraction integrity (calatarama grid)
      run: python library/tools/check_calatarama_grid.py

    - name: Scan for identity / credential leakage
      run: python library/tools/check_public_leaks.py

    - name: Check schema contract
      run: python library/tools/check_schema.py

    - name: Run engine self-checks
      run: python engine/test_deep_read.py

    - name: Differential verification against the independent oracle
      run: python engine/evaluate.py

    - name: Generated artefacts must be committed
      run: |
        git diff --exit-code library/dataset/index library/dataset/bundles.json \
          library/dataset/manifest.json library/dataset/evaluation.json types/geomancy.d.ts \
          || { echo "generated files are stale - run: make build && make index && make types"; exit 1; }
